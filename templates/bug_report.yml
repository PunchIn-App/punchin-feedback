name: Bug report
description: Something is broken or behaving incorrectly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings → About (e.g. 0.6.6)
      placeholder: "0.6.6"
    validations:
      required: true

  - type: dropdown
    id: install-type
    attributes:
      label: Install type
      options:
        - PWA (installed to home screen)
        - Browser tab
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser & version
      placeholder: "e.g. Chrome 124, Safari 17.4"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS & version
      placeholder: "e.g. iOS 17.4, Android 15, macOS 14.4, Windows 11"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "e.g. iPhone 15 Pro, Pixel 8, iPad Air M2, desktop"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Console errors, IndexedDB contents, screen recordings, anything else that might help.
    validations:
      required: false
