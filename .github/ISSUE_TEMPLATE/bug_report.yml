name: Bug report
description: Something is broken or behaving incorrectly in the feedback worker
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        This is the **feedback worker** (the intake service). For a bug in the PunchIn
        **app**, use the account-free form at https://feedback.trackmytime.today/bug instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: dropdown
    id: path
    attributes:
      label: Which path
      options:
        - Form rendering (the /bug or /feature page itself)
        - Submit (validation / spam gate / issue creation)
        - Screenshot upload or serving (R2)
        - Email notification (copy / closed / reopened)
        - Two-way comment reply (inbound email → issue comment)
        - Webhook (issues.closed / reopened / issue_comment)
        - Setup / GitHub App (the /setup manifest flow)
        - Retention sweep (scheduled image deletion)
        - Other / not sure
    validations:
      required: true

  - type: input
    id: locator
    attributes:
      label: Issue number or form involved
      description: The filed issue number and/or the form (/bug, /feature). Do NOT paste anyone's personal email address.
      placeholder: "e.g. punchin#412, /bug"
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Worker version
      description: From package.json / the README version badge (e.g. 0.1.0)
      placeholder: "0.1.0"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: >
        wrangler tail output, the error shown to the reporter, the `X-GitHub-Delivery`
        id of a failing webhook, or relevant request/headers. Redact reporters' personal
        email addresses and any message bodies before pasting.
    validations:
      required: false
