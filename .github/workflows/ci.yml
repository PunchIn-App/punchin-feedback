name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only checks out and tests the code.
permissions:
  contents: read

# One run per PR (or per branch on push): a rapid series of pushes to the same PR
# cancels its own superseded runs instead of queueing them all. Only the newest
# commit's result is meaningful for a merge decision, and nothing here deploys or
# publishes, so cancelling mid-run is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Install + the Worker suite is well under a minute; 15 is a backstop
    # against a hung run burning the full 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Bundle check (wrangler dry-run)
        run: npm run check

  template-sync:
    # The worker renders from templates/*.yml (bundled into src/bundledTemplates.js).
    # Fail if the generated file wasn't regenerated after editing templates/.
    # (punchin is private, so CI can't fetch its live templates unauthenticated;
    # keeping templates/ in step with punchin's is a manual sync — see README.)
    runs-on: ubuntu-latest
    # Install + the Worker suite is well under a minute; 15 is a backstop
    # against a hung run burning the full 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Regenerate src/bundledTemplates.js from templates/*.yml
        run: node scripts/sync-bundled.mjs

      - name: src/bundledTemplates.js is in sync with templates/*.yml
        run: git diff --exit-code src/bundledTemplates.js || (echo "::error::Run 'npm run sync-templates' and commit src/bundledTemplates.js" && exit 1)
