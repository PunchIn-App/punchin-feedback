name = "punchin-feedback"
main = "src/index.js"
compatibility_date = "2026-06-06"

# Public hostname. custom_domain=true provisions the DNS + route at deploy (the
# trackmytime.today zone is on this account).
routes = [
  { pattern = "feedback.trackmytime.today", custom_domain = true },
]

# Workers Logs. Without this, console output (e.g. the fail-closed Turnstile
# misconfiguration warning in spam.js) is only visible while a `wrangler tail` is
# attached — nothing is retained to look back at after an incident.
[observability]
enabled = true

# Static brand assets (CSS + self-hosted Noto WOFF2). Asset-first routing with
# not_found_handling="none" means only real files under ./assets/ are served
# directly; every other path falls through to the Worker's fetch(). Do NOT add
# assets/index.html, or "/" would be served as a file instead of redirecting.
[assets]
directory = "./assets/"
binding = "ASSETS"
not_found_handling = "none"

# Daily image-retention sweep (deletes screenshots past min(1yr-from-upload/reopen,
# 30d-from-close)). UTC.
[triggers]
crons = ["0 3 * * *"]

# Reporter map, template cache, GH-token cache, webhook dedup, rate-limit,
# image-expiry markers. (KV namespace "punchin-feedback", created 2026-06-08.)
[[kv_namespaces]]
binding = "FEEDBACK"
id = "2d03f031558b4b629aec3977aef91ed4"

# Uploaded screenshots. Create with: wrangler r2 bucket create punchin-feedback-attachments
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "punchin-feedback-attachments"

# Outbound transactional email, from feedback@trackmytime.today (same DKIM domain
# as the punchin-email relay). Domain must be onboarded: wrangler email sending enable.
[[send_email]]
name = "EMAIL"

# Non-secret config. Secrets (GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY [PKCS#8],
# GITHUB_WEBHOOK_SECRET, UNSUB_SECRET, TURNSTILE_SECRET) go via `wrangler secret put`.
[vars]
REPO_OWNER       = "PunchIn-App"
REPO_NAME        = "punchin"
TEMPLATE_REF     = "main"
APP_URL          = "https://trackmytime.today"
FROM_ADDRESS     = "feedback@trackmytime.today"
TURNSTILE_SITEKEY = "0x4AAAAAADgd6hZdHvZeL3yL"
ACCENT           = "#2D5BF5"
PROVENANCE_LABEL = "via-web-form"
IMG_MAX_BYTES    = "5242880"
IMG_MAX_COUNT    = "5"
# Two-way comment replies: enabled — comment@trackmytime.today is routed to this
# worker in Email Routing (set up 2026-06-08), so reply addresses don't bounce.
ENABLE_EMAIL_REPLIES = "1"
# ENABLE_SETUP is deliberately ABSENT: the one-time GitHub App bootstrap pages
# (/setup, /setup/callback) are unauthenticated and the App already exists, so
# they 404 in production. Set ENABLE_SETUP = "1" only while bootstrapping a
# fresh deployment, then remove it (and redeploy) again.
